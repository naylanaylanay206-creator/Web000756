
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Page</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #050816, #102b52);
}

.login-box {
    width: 350px;
    padding: 40px 30px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    backdrop-filter: blur(15px);
    box-shadow: 0 0 30px rgba(0,150,255,0.2);
    color: white;
}

.login-box h2 {
    text-align: center;
    margin-bottom: 10px;
    font-size: 28px;
}

.login-box p {
    text-align: center;
    color: #aaa;
    margin-bottom: 30px;
}

.input-box {
    margin-bottom: 20px;
}

.input-box input {
    width: 100%;
    padding: 14px;
    border: 1px solid #456080;
    border-radius: 10px;
    background: rgba(255,255,255,0.08);
    color: white;
    outline: none;
}

.input-box input::placeholder {
    color: #bbb;
}

.login-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #168cff;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.login-btn:hover {
    background: #0066cc;
}

.register {
    text-align: center;
    margin-top: 25px;
    font-size: 14px;
    color: #aaa;
}

.register a {
    color: #39a9ff;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="login-box">
    <h2>Welcome Back!</h2>
    <p>Silakan masuk ke akun Anda</p>

    <form>
        <div class="input-box">
            <input type="text" placeholder="Username" required>
        </div>

        <div class="input-box">
            <input type="password" placeholder="Password" required>
        </div>

        <button class="login-btn" type="submit">
            LOGIN
        </button>
    </form>

    <div class="register">
        Belum punya akun?
        <a href="#">Daftar sekarang</a>
    </div>
</div>

</body>
  </html>
